<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>Sign in · Pi USB Manager</title
  ><style>
    body {
      font: 18px system-ui;
      background: #eef2f7;
      color: #18283e;
      max-width: 420px;
      margin: 15vh auto;
      padding: 24px;
    }
    input,
    button {
      font: inherit;
      padding: 12px;
      margin: 12px 0;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      background: #174c94;
      color: white;
      border: 0;
      border-radius: 6px;
    }
  </style>
  <h1>Pi USB Manager</h1>
  <p>Sign in to manage your USB storage fleet.</p>
  {% if error %}
  <p role="alert">{{ error }}</p>
  {% endif %}
  <form action="/login" method="post">
    <label
      >Administrator password<input
        type="password"
        name="password"
        required
        autocomplete="current-password" /></label
    ><button>Sign in</button>
  </form>
</html>
