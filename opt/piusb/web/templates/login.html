<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi USB Publisher - Sign in</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #10151d; color: #edf2f7; }
    .card { width: min(92vw, 390px); box-sizing: border-box; padding: 2rem; border: 1px solid #354052; border-radius: 14px; background: #18212d; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
    h1 { margin: 0 0 .4rem; font-size: 1.55rem; }
    p { color: #aebbd0; margin: 0 0 1.4rem; }
    label { display: block; margin: .9rem 0 .35rem; font-weight: 650; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #46566d; border-radius: 8px; padding: .7rem .8rem; background: #0f1721; color: #fff; font: inherit; }
    button { width: 100%; margin-top: 1.25rem; border: 0; border-radius: 8px; padding: .75rem; background: #4f8cff; color: #fff; font: inherit; font-weight: 750; cursor: pointer; }
    .flash { padding: .7rem; margin: 0 0 1rem; border-radius: 8px; background: #4a2025; border: 1px solid #a9444e; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Pi USB Publisher</h1>
    <p>Sign in to manage staged files and publish the next USB image.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
