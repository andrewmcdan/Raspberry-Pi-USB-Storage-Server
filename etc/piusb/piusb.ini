[piusb]
# Persistent data locations.
image_dir = /srv/piusb/images
staging_dir = /srv/piusb/staging
incoming_dir = /srv/piusb/incoming
mount_dir = /mnt/piusb-build
state_dir = /var/lib/piusb
runtime_dir = /run/piusb

# Logical size of each FAT32 image. Two images are retained.
image_size_mib = 4096

# The web UI and publisher reject staging contents above this percentage of
# image capacity to leave room for FAT metadata and cluster rounding.
staging_fill_percent = 90

# FAT volume labels are limited to 11 characters.
volume_label = PIUSB

# USB gadget identity. The default VID/PID is suitable only for local
# experimentation. Obtain an appropriate VID/PID before distributing a product.
gadget_name = piusb
manufacturer = Raspberry Pi
product = Pi USB Publisher
serial = auto
vendor_id = 0x1d6b
product_id = 0x0104
bcd_device = 0x0100
bcd_usb = 0x0200

# USB configuration power declaration. Configfs MaxPower is expressed in mA;
# the kernel encodes it into the USB descriptor. 0x80 means bus-powered. Use
# 0xC0 only when the finished hardware is correctly designed as self-powered.
max_power = 500
bm_attributes = 0x80

# stall=0 is the practical default for Pi Zero-class DWC2 mass storage.
# If a particular host has compatibility problems, test stall=1.
stall = 0

# How long the gadget remains disconnected during an image switch.
disconnect_seconds = 3.0

# Leave as auto unless the board exposes more than one UDC and you need to
# select a specific controller name from /sys/class/udc.
udc = auto
